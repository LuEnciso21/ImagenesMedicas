$schema: schema.json
Options:
  bidscoin:
    version: 4.6.1
    subprefix: sub-
    sesprefix: ses-
    bidsignore:
    - extra_data/
    - sub-*_ct.*
    unknowntypes:
    - extra_data
    ignoretypes:
    - exclude
    anon: y
    unzip: null
  plugins:
    dcm2niix2bids:
      command: dcm2niix
      args: -b y -z y -i n -l n
      meta:
      - .json
      - .tsv
      - .tsv.gz
      fallback: y
    events2bids:
      extraInfo: 7
      meta:
      - .json
